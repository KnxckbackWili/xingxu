; A2：单容器进程监督器。托管 postgres / web / scheduler。
; 由 start.sh exec 启动；子进程继承容器环境，web 显式关闭调度器（防多 worker 重复）。
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=5MB
logfile_backups=1
pidfile=/tmp/supervisord.pid
sockfile=/tmp/supervisord.sock
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisord.sock

; A1：容器内 PostgreSQL（USE_POSTGRES=1 时启用）。USE_POSTGRES!=1 时
; pg-entry.sh 直接退出 0（expected，不重启），保持纯 SQLite 模式兼容。
[program:postgres]
command=/app/pg-entry.sh
user=postgres
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=2
startretries=30
stdout_logfile=/tmp/postgres.out.log
stderr_logfile=/tmp/postgres.err.log

[program:web]
; T023/T024：反代（NPM/nginx）前置时信任 X-Forwarded-*，拿到真实客户端 IP 与 https scheme。
; T024 加固：FORWARDED_ALLOW_IPS 只列实际代理；容器默认透传空值，不信任任意来源。
; 局域网/外部直连客户端伪造 X-Forwarded-For/Proto 一律忽略
; （登录审计 IP 与登录限流均使用真实对端）。生产反代场景显式配置为 NPM 可信地址/网段
; （如 FORWARDED_ALLOW_IPS=<NPM 容器 IP> 或所在桥接网段，见 docs/deployment.md）。
command=/bin/bash -c 'ARGS=(); if [ -n "$FORWARDED_ALLOW_IPS" ]; then ARGS=(--forwarded-allow-ips "$FORWARDED_ALLOW_IPS"); fi; exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers "$WEB_CONCURRENCY" --proxy-headers "${ARGS[@]}"'
directory=/app
; 调度器由独立 scheduler 进程承担，web 多 worker 内不启动（防重复通知）。
environment=SCHEDULER_ENABLED=0
autostart=true
autorestart=true
startsecs=5
startretries=30
stdout_logfile=/tmp/web.out.log
stderr_logfile=/tmp/web.err.log

[program:scheduler]
command=python -m app.services.run_scheduler
directory=/app
environment=SCHEDULER_ENABLED=1
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/tmp/scheduler.out.log
stderr_logfile=/tmp/scheduler.err.log

; O2：unhealthy 自愈看门狗。web 挂起（进程未退出，autorestart 不触发）时由本进程
; 先 supervisorctl restart web；持续失败则 supervisorctl shutdown → 容器主进程退出
; → Docker 按 restart: unless-stopped 重建容器。保持单容器形态（不引入 sidecar）。
[program:healthwatch]
command=python -u -m app.services.healthwatch
directory=/app
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/tmp/healthwatch.out.log
stderr_logfile=/tmp/healthwatch.err.log
