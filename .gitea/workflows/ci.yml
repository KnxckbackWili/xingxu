              if token in config or 'extraheader=' in config.lower() or 'credential.helper=' in config.lower():
                  raise SystemExit('Checkout persisted authorization material')
          print('Verified source commit:', expected)
          print('Verified read-only job credential; no persisted checkout authorization')
          PY_CHECKOUT
          unset CI_CHECKOUT_TOKEN
      - name: 使用已验证的 Node 22 工具缓存
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ci_node_arch=arm64 ;;
            x86_64) ci_node_arch=x64 ;;
            *) echo 'Unsupported Node cache architecture'; exit 1 ;;
          esac
          ci_node_dir="/opt/hostedtoolcache/node/22.23.4/$ci_node_arch"
          test -f "$ci_node_dir.complete" || { echo 'Provision the verified Node 22.23.4 toolcache on this runner first'; exit 1; }
          test -x "$ci_node_dir/bin/node"
          export PATH="$ci_node_dir/bin:$PATH"
          node -e 'if (!process.versions.node.startsWith("22.")) process.exit(1)'
          echo "$ci_node_dir/bin" >> "$GITHUB_PATH"
          node --version
          npm --version
      - name: 安装依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: 类型检查 + 构建
        working-directory: frontend
        run: npm run build
      - name: 前端单测
        working-directory: frontend
        run: npm test

